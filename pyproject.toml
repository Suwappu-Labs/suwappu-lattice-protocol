[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltp"
version = "3.0.0"
description = "Lattice Transfer Protocol — post-quantum cryptographic data transfer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Zero external dependencies for core library (stdlib only).
# Real PQ crypto activates automatically when optional deps are installed:
#   pqcrypto → ML-KEM-768 (FIPS 203) + ML-DSA-65 (FIPS 204)
#   pynacl   → XChaCha20-Poly1305 (libsodium)
dependencies = []

[project.optional-dependencies]
performance = [
    "blake3>=0.3.0",
]
crypto = [
    "pqcrypto>=0.3.0",
    "pynacl>=1.5.0",
]
chain = [
    "web3>=6.0.0",
]
network = [
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
gateway = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.24.0",
]
federation = [
    "httpx>=0.24.0",
    "dnspython>=2.4.0",
]
cloud = [
    "boto3>=1.26.0",
]
zk = [
    "py_ecc>=7.0.0",
]
rocksdb = [
    "lsm-db>=0.7",
]
production = [
    "pqcrypto>=0.3.0",
    "pynacl>=1.5.0",
    "zfec>=1.5.0",
    "blake3>=1.0.0",
    "py_ecc>=7.0.0",
]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "blake3>=0.3.0",
    "pqcrypto>=0.3.0",
    "pynacl>=1.5.0",
    "zfec>=1.5.0",
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.24.0",
    "boto3>=1.26.0",
    "moto[kms]>=4.0.0",
    "py_ecc>=7.0.0",
    "dnspython>=2.4.0",
]

[project.scripts]
etp-node = "ltp.node.main:main"
etp-gateway = "ltp.gateway_vm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "smoke: post-deploy smoke tests that require a live gateway (skip if not reachable)",
]
