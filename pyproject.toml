[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ltp"
version = "3.0.0"
description = "Lattice Transfer Protocol — post-quantum cryptographic data transfer"
readme = "README.md"
# NOTE: The repository LICENSE file is Elastic License 2.0 while this
# field declares MIT. The discrepancy is tracked in Linear and must be
# resolved by the project lead before publishing to PyPI.
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "post-quantum",
    "cryptography",
    "ml-kem",
    "ml-dsa",
    "bridge",
    "cross-chain",
    "lattice",
    "merkle-log",
    "fedramp",
    "blockchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Typing :: Typed",
]
# Zero external dependencies for core library (stdlib only).
# Real PQ crypto activates automatically when optional deps are installed:
#   pqcrypto → ML-KEM-768 (FIPS 203) + ML-DSA-65 (FIPS 204)
#   pynacl   → XChaCha20-Poly1305 (libsodium)
#
# pqcrypto is held at <0.5 on purpose. The <0.5 bound predates 1.0 and was
# originally only a post-KyberSlash floor (LTP-A-014), but it is now also
# what keeps us on PQClean, so do not relax it without reading this:
#
# pqcrypto 1.0.0 (2026-08-15) is not an API rename of 0.4 - it replaces the
# implementation. 0.4.x is a CFFI binding over PQClean's C reference code,
# and tests/security/test_attack_kyberslash.py asserts that binding is the
# PQCLEAN_MLKEM768_CLEAN_ (reference, not AVX2) variant. 1.0.0 is a single
# PyO3 extension built on backbone-ml-kem / backbone-ml-dsa 0.2.0, the
# maintainer's own Rust crates, which at the time of writing had ~310
# downloads each against 5.2M / 2.0M for the RustCrypto ml-kem / ml-dsa
# crates they are forked from. That trades a widely reviewed reference
# implementation for one vendor's low-adoption fork, on our KEM and
# signature path.
#
# The upgrade is otherwise seamless, which is the hazard: 0.4 and 1.0 were
# verified byte-compatible in both directions (identical FIPS 203/204 sizes,
# each version's ciphertext decapsulates to the same shared secret under the
# other, and each version's signatures verify under the other), so nothing
# would fail loudly if someone bumped it. Only the security provenance
# changes. Note also that 1.0 drops the pqcrypto._kem CFFI module, so the
# KyberSlash provenance test cannot be expressed against it at all, and that
# its verify() returns None on success and raises InvalidSignatureError on
# failure where 0.4 returned a bool - an `if verify(...)` would silently
# invert.
#
# If we do need to leave 0.4.x, prefer binding the RustCrypto crates that
# suwappu-dag and suwappu-db already use, so the Rust and Python sides share
# one reviewed crypto core.
dependencies = []

[project.urls]
Documentation  = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol/tree/main/docs"
Repository     = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol"
Changelog      = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol/releases"
"Issue Tracker" = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol/issues"
"Security Policy" = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol/blob/main/SECURITY.md"
"Whitepaper"   = "https://github.com/Suwappu-Labs/suwappu-lattice-protocol/blob/main/docs/WHITEPAPER.md"

[project.optional-dependencies]
# Security-sensitive dependencies are pinned with upper bounds. See
# docs/STABILITY_PROMISES.md for the bump policy and how to file a
# semver-floor request for a new transitive CVE.
performance = [
    "blake3>=0.3.0,<2.0",
]
crypto = [
    "pqcrypto>=0.4.0,<0.5",  # LTP-A-014 + PQClean baseline; see the pqcrypto note above before bumping
    "pynacl>=1.5.0,<2.0",
]
chain = [
    "web3>=6.0.0,<8.0.0",
]
network = [
    "grpcio>=1.50.0,<2.0",
    "grpcio-tools>=1.80.0,<2.0",
    "tomli>=2.0.0,<3.0; python_version < '3.11'",
]
gateway = [
    "fastapi>=0.136.3,<1.0",
    "uvicorn[standard]>=0.44.0,<1.0",
    "httpx>=0.24.0,<1.0",
]
federation = [
    "httpx>=0.24.0,<1.0",
    "dnspython>=2.4.0,<3.0",
]
cloud = [
    "boto3>=1.26.0,<2.0",
]
zk = [
    "py_ecc>=7.0.0,<9.0",
]
rocksdb = [
    "lsm-db>=0.7.3,<1.0",
]
production = [
    "pqcrypto>=0.4.0,<0.5",  # LTP-A-014 + PQClean baseline; see the pqcrypto note above before bumping
    "pynacl>=1.5.0,<2.0",
    "zfec>=1.6.0.0,<2.0",
    "blake3>=1.0.0,<2.0",
    "py_ecc>=7.0.0,<9.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "hypothesis>=6.0,<7.0",
    "blake3>=0.3.0,<2.0",
    "pqcrypto>=0.4.0,<0.5",  # LTP-A-014 + PQClean baseline; see the pqcrypto note above before bumping
    "pynacl>=1.5.0,<2.0",
    "zfec>=1.6.0.0,<2.0",
    "grpcio>=1.50.0,<2.0",
    "grpcio-tools>=1.80.0,<2.0",
    "fastapi>=0.136.3,<1.0",
    "uvicorn[standard]>=0.44.0,<1.0",
    "httpx>=0.24.0,<1.0",
    "boto3>=1.26.0,<2.0",
    "moto[kms]>=5.2.2,<6.0",
    "py_ecc>=7.0.0,<9.0",
    "dnspython>=2.4.0,<3.0",
    "pip-audit>=2.7.0,<3.0",
    "pdoc>=14.0,<16.0",
    # Track 2 — lint / type / pre-commit toolchain
    "ruff>=0.15.16,<0.16",
    "mypy>=1.13,<2",
    "pre-commit>=4.6.0,<5",
]

[project.scripts]
etp-node = "ltp.node.main:main"
etp-gateway = "ltp.gateway_vm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ltp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
    "smoke: post-deploy smoke tests that require a live gateway (skip if not reachable)",
]

# ---------------------------------------------------------------------------
# Coverage — enforced floor, single-sourced here so local `pytest --cov`
# and CI (contracts.yml python-test) apply the same number.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/ltp"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Measured 84% on the full suite (Python 3.11, 2026-08-15). Floor set
# below the measurement to absorb per-version variation across the
# 3.10/3.11/3.12 CI matrix. Ratchet upward as coverage grows; never
# lower it to make a PR pass.
fail_under = 75
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Lint / format — Ruff (Track 2, LayerZero/Tempo parity)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "docs/security/audits/external/whitepaper-reviews",
    "docs/plans/archive",
    "out",          # foundry build artifacts
    "broadcast",    # foundry deployment logs
]

[tool.ruff.lint]
# Track 2 PR starts with the real-bug rule set (Pyflakes + pycodestyle).
# B (bugbear) and UP (modernization) introduce >1500 violations on the
# existing crypto codebase — they're queued for a follow-up sweep that
# can autofix in isolation. The rules below are similarly queued; this
# PR ships the *tooling* and the auto-fixable I001 import sort.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-length handled by formatter
    "F401",  # unused-import — 395 sites; most are test fixtures or lazy re-exports, follow-up
    "F403",  # `from module import *` — wildcard imports, 1 site, follow-up
    "F405",  # undefined-local-with-import-star — 7 sites paired with F403, follow-up
    "F541",  # f-string-missing-placeholders — 84 sites, autofixable in follow-up
    "F811",  # redefined-while-unused — 3 sites, follow-up
    "F821",  # undefined-name — 30 sites, all forward-ref strings in lazy-imported type hints (correct pattern); follow-up will add `from __future__ import annotations`
    "F841",  # unused-variable — 67 sites in test fixtures, follow-up
    "E402",  # module-import-not-at-top — 28 sites in scripts/, follow-up
    "E702",  # multiple-statements-on-one-line — 1 site, follow-up
    "E731",  # lambda-assignment — 7 sites, follow-up
    "E741",  # ambiguous-variable-name (l, I, O) — 3 sites, follow-up
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]      # assert False in tests is fine
"scripts/**" = ["E402"]    # CLI scripts often need import-after-setup

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Type checking — mypy strict on src/ltp/ (Track 2)
# ---------------------------------------------------------------------------
[tool.mypy]
# Track 2 PR starts with mypy ENABLED but scoped to security-critical
# modules only. The full codebase has 907 strict-mode errors across 142
# files — annotating it is a project, not a PR. The follow-up sweep
# broadens `files` one submodule at a time.
#
# `follow_imports = silent` is the keystone: it lets mypy resolve
# imported types for accuracy without surfacing errors from files
# outside the curated `files` list. Once a submodule reaches zero
# errors under this scope, we'll add it to `files` and tighten further.
python_version = "3.12"
files = [
    "src/ltp/primitives.py",   # ML-KEM / ML-DSA primitives — must stay typed
    "src/ltp/keypair.py",      # KeyPair surface — touched by every consumer
]
follow_imports = "silent"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
show_column_numbers = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pqcrypto.*",
    "nacl.*",
    "py_ecc.*",
    "zfec.*",
    "blake3.*",
    "eth_abi.*",
    "eth_account.*",
    "pdoc.*",
]
ignore_missing_imports = true
