apiVersion: v1
kind: ConfigMap
metadata:
  name: ltp-dashboard-pause-status
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ltp-observability.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  pause-status.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "PAUSE STATUS",
          "description": "Reflects the on-chain `paused` boolean on LTPAnchorRegistry. RED means the contract is paused — an operator pulled the emergency stop. See docs/OPERATOR_RUNBOOK.md §7.",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "max(ltp_registry_paused) by (chain)",
              "legendFormat": "{{`{{ chain }}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "RUNNING", "color": "green" } } },
                { "type": "value", "options": { "1": { "text": "PAUSED",  "color": "red"   } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name" }
        },
        {
          "type": "table",
          "title": "Recent multisig events",
          "description": "Tabled view of Paused / Unpaused emitter events from LTPAnchorRegistry, plus multisig propose/confirm/execute events. Empty during normal operation.",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "topk(20, increase(ltp_registry_pause_events_total[24h]))",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["ltp", "ltp:pause", "ltp:emergency"],
      "templating": { "list": [] },
      "time": { "from": "now-24h", "to": "now" },
      "title": "LTP — Pause status",
      "uid": "ltp-pause-status",
      "version": 1
    }
