{{- if .Values.ltp.alerting.pagerdutyEnabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pagerduty-integration-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ltp-observability.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.ltp.pagerduty.secretStoreRef.name }}
    kind: {{ .Values.ltp.pagerduty.secretStoreRef.kind }}
  target:
    name: pagerduty-integration-key
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # The PagerDuty service-events v2 integration key is consumed
        # directly by the alertmanager pagerduty_configs.routing_key
        # field — see templates/alertmanager-config.yaml below.
        integration-key: "{{ `{{ .key }}` }}"
  data:
    - secretKey: key
      remoteRef:
        key: {{ .Values.ltp.pagerduty.secretsManagerName }}
{{- end }}
