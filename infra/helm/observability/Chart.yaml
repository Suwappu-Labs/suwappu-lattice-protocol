apiVersion: v2
name: ltp-observability
description: |
  LTP observability stack — Prometheus, Grafana, AlertManager — wired
  to scrape etp-node and etp-gateway pods deployed in Phase C, with
  alert routing to PagerDuty (key sourced from AWS Secrets Manager
  via external-secrets) and Grafana dashboards covering bridge health,
  anchor pipeline status, and the multisig PAUSE indicator.
type: application
version: 0.1.0
appVersion: "0.1.0"

# kube-prometheus-stack ships Prometheus + Alertmanager + Grafana + node
# exporter + kube-state-metrics as a single chart. Pinned to an explicit
# semver — bump deliberately, not by accident. The Chart.lock that gets
# generated by `helm dependency update` is committed alongside.
dependencies:
  - name: kube-prometheus-stack
    version: "85.2.0"
    repository: https://prometheus-community.github.io/helm-charts

keywords:
  - prometheus
  - grafana
  - alertmanager
  - ltp

maintainers:
  - name: LTP Platform
    url: https://github.com/GlobalSettlementNetwork/gsx-lattice-protocol
