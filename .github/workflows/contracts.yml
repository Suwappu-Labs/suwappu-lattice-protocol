name: ETP CI

on:
  push:
    branches: [main, master, "codex/*"]
  pull_request:
    branches: [main, master]

jobs:
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Foundry
        run: |
          # foundry-toolchain's bootstrap chain (foundry-rs/foundry -> foundry-rs/foundryup ->
          # a GitHub release asset) has been intermittently serving a corrupted/invalid
          # foundryup binary on fork-PR runners ("cannot execute binary file"), unrelated to
          # which Foundry version is requested. Install directly with retries instead, so a
          # bad download on one attempt just gets retried against a fresh CDN response.
          set +e
          # Pin FOUNDRY_DIR explicitly -- foundryup-init.sh otherwise installs
          # to $XDG_CONFIG_HOME/.foundry when that's set (as it is on GitHub's
          # runner images), not $HOME/.foundry.
          export FOUNDRY_DIR="$HOME/.foundry"
          for attempt in 1 2 3; do
            echo "Foundry install attempt $attempt/3"
            curl -L https://foundry.paradigm.xyz | bash
            "$FOUNDRY_DIR/bin/foundryup" --install v1.7.1
            if "$FOUNDRY_DIR/bin/forge" --version; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install Foundry after 3 attempts"
          exit 1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@suwappu.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
          forge install succinctlabs/sp1-contracts

      - name: Run forge tests
        working-directory: contracts
        run: forge test -vvv

  python-test:
    name: Python Tests (with real PQ crypto)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Full declared support range (requires-python = ">=3.10").
      # Previously only 3.12 ran in CI; the 3-version matrix lived in an
      # orphaned workflow file that never executed.
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Verify real crypto backends are active
        run: |
          python -c "
          from src.ltp.primitives import _pqcrypto_kem_available, _pqcrypto_sign_available, _pynacl_available
          assert _pqcrypto_kem_available, 'ML-KEM-768 backend (pqcrypto) not available'
          assert _pqcrypto_sign_available, 'ML-DSA-65 backend (pqcrypto) not available'
          assert _pynacl_available, 'XChaCha20-Poly1305 backend (pynacl) not available'
          print('All real crypto backends active: ML-KEM-768, ML-DSA-65, XChaCha20-Poly1305')
          "

      - name: Run Python tests (with coverage floor)
        # The floor lives in pyproject.toml [tool.coverage.report]
        # fail_under so local `pytest --cov` and CI enforce the same
        # number. Ratchet it upward as coverage grows; never lower it
        # to make a PR pass.
        run: pytest tests/ --ignore=tests/test_contract_integration.py --cov=src/ltp --cov-report=term

  dst-gate:
    name: DST Regression Gate (deterministic simulation)
    runs-on: ubuntu-latest
    needs: [python-test]
    # BLOCKING. The violation baseline was driven to zero on 2026-08-15:
    # the fault injector could crash the last online node, violating its
    # own environment assumption (at_least_one_node_online) and cascading
    # spurious violations on seeds 123/777. Fixed in src/simulator/dst.py.
    # Do not raise --max-violations to make a red run pass.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Run DST harness
        # Deterministic Simulation Testing over fixed seeds. This gate
        # previously lived only in an orphaned workflow file
        # (deploy/ci/test.yml) and never ran; src/simulator/ci_harness.py
        # is the harness, tests/test_ci_harness.py covers it.
        run: python -m src.simulator.ci_harness --seeds 42,123,777 --steps 500 --fault-rate 0.1

  dep-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    # Non-blocking: a fresh transitive CVE shouldn't stall every PR.
    # Maintainers triage via the workflow log and open an issue if
    # action is needed. To make this blocking, drop `continue-on-error`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: |
          pip install -e ".[dev,chain]"
          pip install "pip-audit>=2.7.0,<3.0"

      - name: Run pip-audit against installed packages
        run: pip-audit --strict --vulnerability-service osv

  contracts-static-analysis:
    name: Slither + solhint (LTP-A-002/-007/-017 security suite)
    runs-on: ubuntu-latest
    # Non-blocking: surface high-severity findings as a yellow check
    # so they're visible on every PR, but don't gate merge on a
    # false-positive. To make blocking, drop `continue-on-error`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Set up Node (for solhint)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"

      - name: Install Foundry
        run: |
          # foundry-toolchain's bootstrap chain (foundry-rs/foundry -> foundry-rs/foundryup ->
          # a GitHub release asset) has been intermittently serving a corrupted/invalid
          # foundryup binary on fork-PR runners ("cannot execute binary file"), unrelated to
          # which Foundry version is requested. Install directly with retries instead, so a
          # bad download on one attempt just gets retried against a fresh CDN response.
          set +e
          # Pin FOUNDRY_DIR explicitly -- foundryup-init.sh otherwise installs
          # to $XDG_CONFIG_HOME/.foundry when that's set (as it is on GitHub's
          # runner images), not $HOME/.foundry.
          export FOUNDRY_DIR="$HOME/.foundry"
          for attempt in 1 2 3; do
            echo "Foundry install attempt $attempt/3"
            curl -L https://foundry.paradigm.xyz | bash
            "$FOUNDRY_DIR/bin/foundryup" --install v1.7.1
            if "$FOUNDRY_DIR/bin/forge" --version; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install Foundry after 3 attempts"
          exit 1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@suwappu.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
          forge install succinctlabs/sp1-contracts

      - name: Slither static analysis
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8  # v0.4.0
        with:
          target: "contracts/"
          slither-config: "contracts/slither.config.json"
          fail-on: high

      - name: Install solhint
        run: npm install -g solhint@5.0.3

      - name: Run solhint
        working-directory: contracts
        run: solhint 'src/**/*.sol' --max-warnings=0

  contracts-invariants:
    name: Foundry invariant suite (contracts/test/invariant/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Foundry
        run: |
          # foundry-toolchain's bootstrap chain (foundry-rs/foundry -> foundry-rs/foundryup ->
          # a GitHub release asset) has been intermittently serving a corrupted/invalid
          # foundryup binary on fork-PR runners ("cannot execute binary file"), unrelated to
          # which Foundry version is requested. Install directly with retries instead, so a
          # bad download on one attempt just gets retried against a fresh CDN response.
          set +e
          # Pin FOUNDRY_DIR explicitly -- foundryup-init.sh otherwise installs
          # to $XDG_CONFIG_HOME/.foundry when that's set (as it is on GitHub's
          # runner images), not $HOME/.foundry.
          export FOUNDRY_DIR="$HOME/.foundry"
          for attempt in 1 2 3; do
            echo "Foundry install attempt $attempt/3"
            curl -L https://foundry.paradigm.xyz | bash
            "$FOUNDRY_DIR/bin/foundryup" --install v1.7.1
            if "$FOUNDRY_DIR/bin/forge" --version; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install Foundry after 3 attempts"
          exit 1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@suwappu.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
          forge install succinctlabs/sp1-contracts

      - name: Run invariant tests
        working-directory: contracts
        run: forge test --match-path 'test/invariant/*' -vv

  integration-test:
    name: Contract Integration (Python + Anvil)
    runs-on: ubuntu-latest
    needs: [forge-test, python-test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Foundry
        run: |
          # foundry-toolchain's bootstrap chain (foundry-rs/foundry -> foundry-rs/foundryup ->
          # a GitHub release asset) has been intermittently serving a corrupted/invalid
          # foundryup binary on fork-PR runners ("cannot execute binary file"), unrelated to
          # which Foundry version is requested. Install directly with retries instead, so a
          # bad download on one attempt just gets retried against a fresh CDN response.
          set +e
          # Pin FOUNDRY_DIR explicitly -- foundryup-init.sh otherwise installs
          # to $XDG_CONFIG_HOME/.foundry when that's set (as it is on GitHub's
          # runner images), not $HOME/.foundry.
          export FOUNDRY_DIR="$HOME/.foundry"
          for attempt in 1 2 3; do
            echo "Foundry install attempt $attempt/3"
            curl -L https://foundry.paradigm.xyz | bash
            "$FOUNDRY_DIR/bin/foundryup" --install v1.7.1
            if "$FOUNDRY_DIR/bin/forge" --version; then
              echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install Foundry after 3 attempts"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Install Solidity dependencies and build
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@suwappu.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
          forge install succinctlabs/sp1-contracts
          forge build

      - name: Start anvil
        run: |
          anvil &
          sleep 2

      - name: Deploy contract to local anvil
        working-directory: contracts
        run: |
          forge script script/Deploy.s.sol --rpc-url http://localhost:8545 --broadcast

      - name: Run integration tests
        run: pytest tests/test_contract_integration.py -v

      - name: Stop anvil
        if: always()
        run: pkill -f anvil || true
