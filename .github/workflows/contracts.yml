name: ETP CI

on:
  push:
    branches: [main, master, "codex/*"]
  pull_request:
    branches: [main, master]

jobs:
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@gsx.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts

      - name: Run forge tests
        working-directory: contracts
        run: forge test -vvv

  python-test:
    name: Python Tests (with real PQ crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Verify real crypto backends are active
        run: |
          python -c "
          from src.ltp.primitives import _pqcrypto_kem_available, _pqcrypto_sign_available, _pynacl_available
          assert _pqcrypto_kem_available, 'ML-KEM-768 backend (pqcrypto) not available'
          assert _pqcrypto_sign_available, 'ML-DSA-65 backend (pqcrypto) not available'
          assert _pynacl_available, 'XChaCha20-Poly1305 backend (pynacl) not available'
          print('All real crypto backends active: ML-KEM-768, ML-DSA-65, XChaCha20-Poly1305')
          "

      - name: Run Python tests
        run: pytest tests/ -v --ignore=tests/test_contract_integration.py

  dep-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    # Non-blocking: a fresh transitive CVE shouldn't stall every PR.
    # Maintainers triage via the workflow log and open an issue if
    # action is needed. To make this blocking, drop `continue-on-error`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: |
          pip install -e ".[dev,chain]"
          pip install "pip-audit>=2.7.0,<3.0"

      - name: Run pip-audit against installed packages
        run: pip-audit --strict --vulnerability-service osv

  contracts-static-analysis:
    name: Slither + solhint (LTP-A-002/-007/-017 security suite)
    runs-on: ubuntu-latest
    # Non-blocking: surface high-severity findings as a yellow check
    # so they're visible on every PR, but don't gate merge on a
    # false-positive. To make blocking, drop `continue-on-error`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Set up Node (for solhint)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@gsx.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts

      - name: Slither static analysis
        uses: crytic/slither-action@f197989dea5b53e986d0f88c60a034ddd77ec9a8  # v0.4.0
        with:
          target: "contracts/"
          slither-config: "contracts/slither.config.json"
          fail-on: high

      - name: Install solhint
        run: npm install -g solhint@5.0.3

      - name: Run solhint
        working-directory: contracts
        run: solhint 'src/**/*.sol' || true

  contracts-invariants:
    name: Foundry invariant suite (contracts/test/invariant/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@gsx.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts

      - name: Run invariant tests
        working-directory: contracts
        run: forge test --match-path 'test/invariant/*' -vv

  integration-test:
    name: Contract Integration (Python + Anvil)
    runs-on: ubuntu-latest
    needs: [forge-test, python-test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Install Solidity dependencies and build
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@gsx.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
          forge build

      - name: Start anvil
        run: |
          anvil &
          sleep 2

      - name: Deploy contract to local anvil
        working-directory: contracts
        run: |
          forge script script/Deploy.s.sol --rpc-url http://localhost:8545 --broadcast

      - name: Run integration tests
        run: pytest tests/test_contract_integration.py -v

      - name: Stop anvil
        if: always()
        run: pkill -f anvil || true
