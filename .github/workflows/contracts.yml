name: ETP CI

on:
  push:
    branches: [main, master, "codex/*"]
  pull_request:
    branches: [main, master]

jobs:
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Solidity dependencies
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@gsx.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts

      - name: Run forge tests
        working-directory: contracts
        run: forge test -vvv

  python-test:
    name: Python Tests (with real PQ crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Verify real crypto backends are active
        run: |
          python -c "
          from src.ltp.primitives import _pqcrypto_kem_available, _pqcrypto_sign_available, _pynacl_available
          assert _pqcrypto_kem_available, 'ML-KEM-768 backend (pqcrypto) not available'
          assert _pqcrypto_sign_available, 'ML-DSA-65 backend (pqcrypto) not available'
          assert _pynacl_available, 'XChaCha20-Poly1305 backend (pynacl) not available'
          print('All real crypto backends active: ML-KEM-768, ML-DSA-65, XChaCha20-Poly1305')
          "

      - name: Run Python tests
        run: pytest tests/ -v --ignore=tests/test_contract_integration.py

  integration-test:
    name: Contract Integration (Python + Anvil)
    runs-on: ubuntu-latest
    needs: [forge-test, python-test]
    steps:
      - uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,chain]"

      - name: Install Solidity dependencies and build
        working-directory: contracts
        run: |
          git config user.name "ci"
          git config user.email "ci@gsx.dev"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
          forge build

      - name: Start anvil
        run: |
          anvil &
          sleep 2

      - name: Deploy contract to local anvil
        working-directory: contracts
        run: |
          forge script script/Deploy.s.sol --rpc-url http://localhost:8545 --broadcast

      - name: Run integration tests
        run: pytest tests/test_contract_integration.py -v

      - name: Stop anvil
        if: always()
        run: pkill -f anvil || true
