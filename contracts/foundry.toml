[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "sp1-contracts/=lib/sp1-contracts/contracts/src/",
]

[rpc_endpoints]
suwappu_testnet = "${SUWAPPU_RPC_URL}"
local = "http://localhost:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[etherscan]
base_sepolia = { key = "${BLOCKSCOUT_API_KEY}", url = "https://base-sepolia.blockscout.com/api/", chain = 84532 }
