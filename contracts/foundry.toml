[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# Read-only access to test fixtures (P10 storage-proof eth_getProof vectors).
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# Prague profile: EIP-2537 precompiles + BLS H2C kernel tests.
# Run with: FOUNDRY_PROFILE=prague forge test --match-contract BlsHashToCurve
[profile.prague]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "prague"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]
# ffi required for py_ecc golden-vector generation.
ffi = true
fs_permissions = [
    {access = "read", path = "./test/fixtures"},
    {access = "read-write", path = "./test/fixtures/bls"},
]

[invariant]
# Audit program P0: deeper stateful invariant coverage for the custody layer.
# fail_on_revert = false because handlers use try/catch + ghost-variable
# accounting (see test/invariant/*.invariant.t.sol).
runs = 512
depth = 100
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

[rpc_endpoints]
suwappu_testnet = "${SUWAPPU_RPC_URL}"
local = "http://localhost:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"
# Public BSC RPC — hosts a live SP1Helios deployment (Across V4) used by the P10
# Sp1HeliosHeaderOracle fork test. Overridable via ${BSC_RPC_URL}.
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[etherscan]
base_sepolia = { key = "${BLOCKSCOUT_API_KEY}", url = "https://base-sepolia.blockscout.com/api/", chain = 84532 }
