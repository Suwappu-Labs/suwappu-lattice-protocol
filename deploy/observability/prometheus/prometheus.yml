global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: etp-mainnet
    network: suwappu-lattice-protocol

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: etp-nodes
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      # Replace with your node endpoints. Gateway port is 8080 by default.
      - targets:
          - "host.docker.internal:8080"
        labels:
          node_id: etp-local-1
          region: US-East
      # Example additional nodes (uncomment and edit):
      # - targets: ["etp-node-us-east-1:8080"]
      #   labels:
      #     node_id: etp-mainnet-us-east-1
      #     region: US-East
      # - targets: ["etp-node-eu-west-1:8080"]
      #   labels:
      #     node_id: etp-mainnet-eu-west-1
      #     region: EU-West

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
