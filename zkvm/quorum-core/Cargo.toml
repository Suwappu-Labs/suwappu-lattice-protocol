[package]
name = "quorum-core"
version = "0.1.0"
edition = "2021"
description = "GSX-DAG validator-quorum verification core for Path C (SP1 Groth16 circuit, Slice 1)"

# IMPORTANT: this crate is intentionally a standalone workspace so it can be
# compiled natively (for tests + host integration) AND later reused inside the
# SP1 zkVM guest without pulling in any std-only dependencies.  Match the
# setup of the sibling zkvm/sp1-mldsa-verifier.

[dependencies]
# Same ML-DSA-65 crate used by the SP1 guest — guarantees byte-identical
# encoding/verification semantics when this logic moves in-circuit (Slice 2).
# ml-dsa 0.1.0-rc.8 is the version used by the sp1-mldsa-verifier guest; we
# allow 0.1.x stable because rc.8 doesn't compile against pkcs8 >=0.11.0
# (stable), but 0.1.1 has an identical API for all types we use.  The SP1
# guest locks its own Cargo.lock to rc.8 + pkcs8-rc.11 which is consistent.
ml-dsa = { version = "0.1", default-features = true }

# Keccak256 for pkHash, matching Solidity keccak256(pubkey).
# NOTE: Keccak256 != Sha3_256 — they differ in domain-separation padding.
sha3 = "0.10"
